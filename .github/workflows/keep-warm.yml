# Render's free tier puts the API to sleep after 15 idle minutes, and waking takes up to a minute.
# A ping every 10 minutes keeps it awake for visitors and lets queued runs start right away. GitHub delays
# scheduled runs by hours on a quiet repo, so this is the backup; supabase/hosted/keep-api-warm.sql is the main one.
# One always-on free service fits inside Render's 750 free hours a month.
name: keep API warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl --fail --silent --show-error --max-time 90 --retry 2 https://prismos-1.onrender.com/health
