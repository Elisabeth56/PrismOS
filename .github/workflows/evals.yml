# Runs every eval case through the real pipeline and a single-prompt baseline, with real models.
# Needs GEMINI_API_KEY and GROQ_API_KEY as repository secrets. Costs free-tier quota, so it runs on
# demand and when the eval itself changes, not on every push.
name: evals

on:
  workflow_dispatch:
    inputs:
      cases:
        description: Comma-separated case ids (empty runs all)
        default: ''
  pull_request:
    paths: ['apps/api/evals/**', 'apps/api/app/pipeline/**', 'apps/api/app/ai/**', '.github/workflows/evals.yml']

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      EVAL: '1'
      EVAL_CASES: ${{ inputs.cases }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Check the keys are there
        run: test -n "$GEMINI_API_KEY" && test -n "$GROQ_API_KEY" || (echo "Add GEMINI_API_KEY and GROQ_API_KEY as repository secrets" && exit 1)
      - run: uv run pytest evals/test_eval.py -s -p no:logging
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: apps/api/evals/results/
